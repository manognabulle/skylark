<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skylark BI Agent</title>
<style>
  :root{--bg:#0b0e11;--panel:#12161b;--panel-2:#161b21;--line:#232a32;--text:#e7ebee;--muted:#8a97a3;--accent:#ff8a34;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  #app{max-width:820px;margin:0 auto;padding:20px;height:100vh;display:flex;flex-direction:column;}
  header{padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;}
  header h1{font-size:15px;margin:0;} header .sub{font-size:11.5px;color:var(--muted);font-family:monospace;margin-top:3px;}
  #messages{flex:1;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;}
  .msg{margin-bottom:14px;max-width:85%;}
  .msg.user{margin-left:auto;}
  .who{font-size:10px;color:var(--muted);font-family:monospace;text-transform:uppercase;margin-bottom:4px;}
  .msg.user .who{text-align:right;}
  .bubble{padding:10px 14px;border-radius:10px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;}
  .msg.user .bubble{background:var(--accent);color:#1a0f04;border-radius:10px 10px 2px 10px;}
  .msg.assistant .bubble{background:var(--panel-2);border:1px solid var(--line);border-radius:10px 10px 10px 2px;}
  .composer{display:flex;gap:8px;margin-top:12px;}
  input{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:8px;font-size:13.5px;}
  input:focus{outline:none;border-color:var(--accent);}
  button{background:var(--accent);color:#1a0f04;border:none;border-radius:8px;padding:0 18px;font-weight:700;cursor:pointer;}
  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:30px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Skylark BI Agent</h1>
    <div class="sub">FastAPI backend &middot; monday.com API &middot; Gemini tool-use</div>

  </header>
  <div id="messages"><div class="empty">Ask about work orders or the deal pipeline.</div></div>
  <div class="composer">
    <input id="input" placeholder="e.g. How's our pipeline looking for the mining sector?" />
    <button id="send">Send</button>
  </div>
</div>
<script>
  const API_BASE = ""; // same-origin; set to your deployed backend URL if hosted separately
  let sessionId = null;
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');

  function render(role, text) {
    if (messagesEl.querySelector('.empty')) messagesEl.innerHTML = '';
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `<div class="who">${role === 'user' ? 'You' : 'Agent'}</div><div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    render('user', text);
    const thinking = render('assistant', 'Thinking…');
    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      const data = await res.json();
      if (!res.ok) {
        thinking.querySelector('.bubble').textContent = `Error: ${data.detail || 'Failed to connect'}`;
        return;
      }
      sessionId = data.session_id;
      thinking.querySelector('.bubble').textContent = data.reply;
    } catch (e) {
      thinking.querySelector('.bubble').textContent = 'Error: ' + e.message;
    }

  }

  document.getElementById('send').onclick = send;
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
