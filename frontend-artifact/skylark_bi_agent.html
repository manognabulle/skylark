<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skylark BI Agent</title>
<style>
  :root{
    --bg:#0b0e11;
    --panel:#12161b;
    --panel-2:#161b21;
    --line:#232a32;
    --text:#e7ebee;
    --muted:#8a97a3;
    --accent:#ff8a34;
    --accent-dim:#7a4720;
    --good:#3ecf8e;
    --bad:#ff5c5c;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    background-position: -1px -1px;
    background-attachment: fixed;
  }
  #app{max-width:1180px;margin:0 auto;padding:20px 20px 40px;min-height:100%;}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
    background:linear-gradient(180deg,var(--panel),var(--panel-2)); border:1px solid var(--line);
    border-radius:10px; margin-bottom:16px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:radial-gradient(circle at 30% 30%, var(--accent), var(--accent-dim));
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;color:#0b0e11;font-size:15px;}
  .brand h1{font-size:15px;margin:0;letter-spacing:0.2px;}
  .brand .sub{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:2px;}
  nav{display:flex;gap:6px;}
  nav button{background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:7px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:var(--sans);transition:.15s;}
  nav button.active{background:var(--accent);color:#1a0f04;border-color:var(--accent);font-weight:600;}
  nav button:hover:not(.active){border-color:var(--accent-dim);color:var(--text);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;}
  .grid2{display:grid;grid-template-columns:280px 1fr;gap:16px;}
  @media (max-width:820px){.grid2{grid-template-columns:1fr;}}

  h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px;font-weight:600;}
  .board-card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--panel-2);}
  .board-card .name{font-size:13px;font-weight:600;}
  .board-card .stat{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--muted);}
  .dot.ok{background:var(--good);}
  .dot.warn{background:var(--accent);}
  .dot.bad{background:var(--bad);}

  button.action{width:100%;background:var(--accent);color:#1a0f04;border:none;border-radius:7px;
    padding:10px;font-weight:600;font-size:12.5px;cursor:pointer;margin-top:6px;}
  button.action:disabled{opacity:.4;cursor:default;}
  button.action.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  button.action.secondary:hover{border-color:var(--accent-dim);}

  .progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px;}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .3s;}

  #log{font-family:var(--mono);font-size:11px;color:var(--muted);max-height:220px;overflow-y:auto;
    margin-top:14px;border-top:1px solid var(--line);padding-top:10px;}
  #log div{padding:2px 0;}
  #log .err{color:var(--bad);}
  #log .ok{color:var(--good);}

  .chat-wrap{display:flex;flex-direction:column;height:70vh;}
  #messages{flex:1;overflow-y:auto;padding-right:6px;}
  .msg{margin-bottom:16px;max-width:88%;}
  .msg.user{margin-left:auto;}
  .msg .bubble{padding:10px 14px;border-radius:10px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;}
  .msg.user .bubble{background:var(--accent);color:#1a0f04;font-weight:500;border-radius:10px 10px 2px 10px;}
  .msg.assistant .bubble{background:var(--panel-2);border:1px solid var(--line);border-radius:10px 10px 10px 2px;}
  .msg .who{font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
  .msg.user .who{text-align:right;}
  .msg .tool-trace{font-family:var(--mono);font-size:10px;color:var(--accent);opacity:.75;margin-top:6px;}

  .composer{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px;}
  .composer input{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:11px 13px;border-radius:8px;font-size:13.5px;font-family:var(--sans);}
  .composer input:focus{outline:none;border-color:var(--accent-dim);}
  .composer button{background:var(--accent);color:#1a0f04;border:none;border-radius:8px;padding:0 18px;
    font-weight:700;cursor:pointer;font-size:13px;}
  .composer button:disabled{opacity:.4;}

  .suggestions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
  .suggestions button{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    padding:6px 11px;border-radius:16px;font-size:11.5px;cursor:pointer;}
  .suggestions button:hover{border-color:var(--accent);color:var(--text);}

  .typing{display:inline-flex;gap:3px;padding:10px 14px;}
  .typing span{width:5px;height:5px;background:var(--muted);border-radius:50%;animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:40px 20px;}
  .banner{font-size:11.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;margin-bottom:14px;font-family:var(--mono);}
  .banner b{color:var(--accent);}
  code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:.92em;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-mark">SD</div>
      <div>
        <h1>Skylark BI Agent</h1>
        <div class="sub">monday.com &middot; work orders + deal funnel &middot; live MCP</div>
      </div>
    </div>
    <nav>
      <button id="tab-setup" class="active">Setup</button>
      <button id="tab-chat">Chat</button>
    </nav>
  </header>

  <div id="view-setup"></div>
  <div id="view-chat" style="display:none"></div>
</div>

  dealImported: parseInt(localStorage_get('sk_deal_imported') || '0'),
  importing: false,
  messages: [], // {role, text}
  sending: false,
};

// NOTE: artifacts cannot use window.localStorage. Use an in-memory shim so
// setup progress at least survives re-renders within this session; a fresh
// page load will re-check monday.com directly (idempotent setup).
const _mem = {};
function localStorage_get(k){ return _mem[k] || null; }
function localStorage_set(k,v){ _mem[k] = v; }

// ----------------------------------------------------------------------------
// Low level: call the Anthropic API, optionally wired to the monday.com MCP
// connector. The API executes MCP tool calls server-side; the response
// content array may contain text / mcp_tool_use / mcp_tool_result blocks.
// ----------------------------------------------------------------------------
async function callClaude({ system, messages, useMcp = true, maxTokens = 1000 }) {
  const body = {
    model: MODEL,
    max_tokens: maxTokens,
    system,
    messages,
  };
  if (useMcp) {
    body.mcp_servers = [{ type: "url", url: MCP_URL, name: "monday" }];
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "anthropic-beta": "mcp-client-2025-04-04",
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => res.statusText);
    throw new Error(`API ${res.status}: ${errText.slice(0, 300)}`);
  }
  return res.json();
}

function extractText(data) {
  if (!data || !data.content) return "";
  return data.content
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n")
    .trim();
}

function extractToolTrace(data) {
  if (!data || !data.content) return [];
  return data.content
    .filter((b) => b.type === "mcp_tool_use")
    .map((b) => b.name);
}

function extractJsonBlock(text) {
  // pull the last {...} JSON object out of a text blob
  const matches = [...text.matchAll(/\{[\s\S]*\}/g)];
  if (!matches.length) return null;
  const candidate = matches[matches.length - 1][0];
  try { return JSON.parse(candidate); } catch (e) { return null; }
}

// Auto-continue if the model hit max_tokens mid tool-call chain.
async function callClaudeResilient(opts, log) {
  let data = await callClaude(opts);
  let hops = 0;
  let fullText = extractText(data);
  let trace = extractToolTrace(data);
  const runningMessages = [...opts.messages];
  while (data.stop_reason === "max_tokens" && hops < 4) {
    hops++;
    if (log) log(`… response cut off, requesting continuation (${hops})`, 'warn');
    runningMessages.push({ role: "assistant", content: data.content });
    runningMessages.push({ role: "user", content: "Continue exactly where you left off." });
    data = await callClaude({ ...opts, messages: runningMessages });
    fullText += "\n" + extractText(data);
    trace = trace.concat(extractToolTrace(data));
  }
  return { text: fullText.trim(), trace, raw: data };
}

// ----------------------------------------------------------------------------
// SETUP: create-or-find boards, then bulk import in small batches (kept small
// deliberately — see README/Decision Log re: response-size constraints).
// ----------------------------------------------------------------------------
const WO_COLUMN_SPEC = `
- "Sector" — status/dropdown column
- "Type of Work" — text column
- "Nature of Work" — status/dropdown column
- "Execution Status" — status column
- "Document Type" — status/dropdown column
- "Date of PO/LOI" — date column
- "Probable Start Date" — date column
- "Probable End Date" — date column
- "Amount Incl GST" — numbers column
- "Billed Value Incl GST" — numbers column
- "Collected Amount Incl GST" — numbers column
- "Amount Receivable" — numbers column
- "Invoice Status" — status column
- "WO Status billed" — status column
- "BD/KAM Personnel code" — text column
- "Customer Name Code" — text column
The item name itself should be the "Deal name masked" value.`.trim();

const DEAL_COLUMN_SPEC = `
- "Owner code" — text column
- "Client Code" — text column
- "Deal Status" — status column
- "Close Date (A)" — date column
- "Closure Probability" — status/dropdown column
- "Masked Deal value" — numbers column
- "Tentative Close Date" — date column
- "Deal Stage" — status/dropdown column (many stages, keep them all)
- "Product deal" — text column
- "Sector/service" — status/dropdown column
- "Created Date" — date column
The item name itself should be the "Deal Name" value.`.trim();

async function findOrCreateBoard(boardName, columnSpec, log) {
  log(`Looking for board "${boardName}"…`);
  const sys = `You are a monday.com workspace-setup assistant with MCP tools connected to a live monday.com account.
Task: ensure a board named exactly "${boardName}" exists.
1. First search/list existing boards for one named exactly "${boardName}".
2. If it exists, do NOT create a duplicate — just use it.
3. If it does not exist, create it (a plain board, not a doc) with these columns:
${columnSpec}
Respond with ONLY one line of JSON at the very end of your message, nothing after it, in this exact shape:
{"board_id": "<the numeric or string board id>", "created": true|false}`;

  const { text, trace } = await callClaudeResilient({
    system: sys,
    messages: [{ role: "user", content: `Ensure board "${boardName}" exists and return its id.` }],
    maxTokens: 1000,
  }, log);

  const parsed = extractJsonBlock(text);
  if (!parsed || !parsed.board_id) {
    throw new Error(`Could not determine board id for "${boardName}". Model said: ${text.slice(0,200)}`);
  }
  log(`Board "${boardName}" ready — id ${parsed.board_id} (${parsed.created ? 'newly created' : 'already existed'}) [tools: ${trace.join(', ') || 'none'}]`, 'ok');
  return parsed.board_id;
}

function chunk(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

async function importBatch(boardId, boardName, records, log) {
  const sys = `You are a monday.com data-import assistant with MCP tools connected to a live monday.com account.
Board id: ${boardId} (name: "${boardName}").
Create one monday.com item per JSON record below, mapping each record's fields onto the matching columns on that board (match by column name/meaning). Preserve values as-is, including blanks/nulls — do not invent or clean data during import.
Work efficiently: batch/bulk-create if the tools support it, otherwise create items one by one without narrating each one.
When finished, respond with ONLY one line of JSON at the very end, nothing after it:
{"created": <number of items you created>}`;
  const { text, trace } = await callClaudeResilient({
    system: sys,
    messages: [{ role: "user", content: `Import these ${records.length} records:\n${JSON.stringify(records)}` }],
    maxTokens: 1000,
  }, log);
  const parsed = extractJsonBlock(text);
  const n = parsed && typeof parsed.created === 'number' ? parsed.created : records.length;
  return { n, trace };
}

async function runSetupAndImport(log, onProgress) {
  state.importing = true;
  try {
    if (!state.woBoardId) {
      state.woBoardId = await findOrCreateBoard(WO_BOARD_NAME, WO_COLUMN_SPEC, log);
      localStorage_set('sk_wo_board_id', state.woBoardId);
    } else {
      log(`Reusing known Work Orders board id ${state.woBoardId}`);
    }
    if (!state.dealBoardId) {
      state.dealBoardId = await findOrCreateBoard(DEAL_BOARD_NAME, DEAL_COLUMN_SPEC, log);
      localStorage_set('sk_deal_board_id', state.dealBoardId);
    } else {
      log(`Reusing known Deals board id ${state.dealBoardId}`);
    }
    onProgress();

    const BATCH = 5;
    const woChunks = chunk(WO_DATA.slice(state.woImported), BATCH);
    for (const c of woChunks) {
      log(`Importing work orders ${state.woImported + 1}–${state.woImported + c.length} of ${WO_DATA.length}…`);
      const { n, trace } = await importBatch(state.woBoardId, WO_BOARD_NAME, c, log);
      state.woImported += n;
      localStorage_set('sk_wo_imported', String(state.woImported));
      log(`  ↳ created ${n} items [tools: ${trace.join(', ') || 'none'}]`, 'ok');
      onProgress();
    }

    const dealChunks = chunk(DEAL_DATA.slice(state.dealImported), BATCH);
    for (const c of dealChunks) {
      log(`Importing deals ${state.dealImported + 1}–${state.dealImported + c.length} of ${DEAL_DATA.length}…`);
      const { n, trace } = await importBatch(state.dealBoardId, DEAL_BOARD_NAME, c, log);
      state.dealImported += n;
      localStorage_set('sk_deal_imported', String(state.dealImported));
      log(`  ↳ created ${n} items [tools: ${trace.join(', ') || 'none'}]`, 'ok');
      onProgress();
    }

    log(`Import complete. Work Orders: ${state.woImported}/${WO_DATA.length}, Deals: ${state.dealImported}/${DEAL_DATA.length}.`, 'ok');
  } catch (e) {
    log(`Error: ${e.message}`, 'err');
  } finally {
    state.importing = false;
    onProgress();
  }
}

async function verifyCounts(log, onProgress) {
  log('Asking monday.com for live item counts on both boards…');
  const sys = `You have MCP tools connected to a live monday.com account. Count the number of items on board id ${state.woBoardId} ("${WO_BOARD_NAME}") and board id ${state.dealBoardId} ("${DEAL_BOARD_NAME}"). Respond with ONLY one final JSON line: {"wo_count": <n>, "deal_count": <n>}`;
  try {
    const { text } = await callClaudeResilient({
      system: sys,
      messages: [{ role: "user", content: "Report live item counts for both boards." }],
      maxTokens: 500,
    }, log);
    const parsed = extractJsonBlock(text);
    if (parsed) {
      log(`Live counts — Work Orders: ${parsed.wo_count} (expected ${WO_DATA.length}), Deals: ${parsed.deal_count} (expected ${DEAL_DATA.length})`,
        (parsed.wo_count === WO_DATA.length && parsed.deal_count === DEAL_DATA.length) ? 'ok' : 'warn');
    } else {
      log(`Could not parse verification result: ${text.slice(0,200)}`, 'err');
    }
  } catch (e) {
    log(`Verification failed: ${e.message}`, 'err');
  }
  onProgress();
}

// ----------------------------------------------------------------------------
// CHAT: founder-level BI Q&A. Always queries monday.com live via MCP —
// never reads WO_DATA/DEAL_DATA.
// ----------------------------------------------------------------------------
function chatSystemPrompt() {
  return `You are Skylark Drones' internal Business Intelligence agent, answering founders/execs conversationally.

You have MCP tools connected to a live monday.com account with two boards:
- "${WO_BOARD_NAME}" (id ${state.woBoardId || 'unknown — look it up by name first'}) — project execution / work-order data: sector, type of work, execution status, PO/LOI and delivery dates, invoiced/billed/collected amounts, receivables, invoice status.
- "${DEAL_BOARD_NAME}" (id ${state.dealBoardId || 'unknown — look it up by name first'}) — sales pipeline: owner, client, deal status (Open/Won/Dead/On Hold), deal stage (a lettered funnel A→O), deal value, probability, sector/service, dates.

Rules you must follow:
1. NEVER answer from memory or assumption — always query monday.com live via MCP tools for the actual current data before answering a business question. Re-query fresh each turn; do not assume data hasn't changed.
2. This is real messy operational data. Handle it gracefully:
   - Many fields are blank/null — state this rather than treating null as zero, unless the question is specifically about totals where a null clearly means "not applicable yet."
   - Text fields have inconsistent casing/typos (e.g. "Billed" vs "BIlled", "Partially Billed"). Normalize/group these yourself when aggregating and mention you did so.
   - A few rows are corrupted duplicate header rows (e.g. a "Deal Status" row literally containing the text "Deal Status" instead of a real status). Detect and exclude these from any aggregate calculation, and mention if you excluded any.
   - Sector names ("Mining", "Renewables", "Powerline", "Railways", "Construction", "DSP", "Tender", "Others", etc.) should be matched case-insensitively.
   - Dates may be missing or inconsistently formatted; state clearly when a date-based filter had to skip rows with missing dates.
3. Give context and insight, not just a number: mention scale (e.g. "12 of 40 deals"), trend/comparison where relevant, and one caveat about data completeness if relevant.
4. If a query is ambiguous (e.g. "this quarter" — which quarter/fiscal year? "revenue" — invoiced, billed, or collected?), ask ONE short clarifying question before running large aggregations — unless a reasonable default is obvious, in which case state the default you're using and proceed.
5. If asked to prepare a "leadership update" / "exec summary" / "weekly update", structure it tightly: Pipeline health, Revenue/collections status, Operational execution by sector, Data quality flags worth leadership's attention. Keep it skimmable — short lines, no fluff.
6. Keep answers concise and skimmable. Use plain text, short paragraphs or a tight list — no heavy markdown headers.
7. If monday.com tools error out or a board can't be found, say so plainly and suggest running Setup first — don't fabricate numbers.`;
}

async function sendChatMessage(userText, log, onProgress) {
  state.messages.push({ role: 'user', text: userText });
  state.sending = true;
  onProgress();
  try {
    const apiMessages = state.messages.map(m => ({ role: m.role, content: m.text }));
    const { text, trace } = await callClaudeResilient({
      system: chatSystemPrompt(),
      messages: apiMessages,
      maxTokens: 1000,
    }, log || (()=>{}));
    state.messages.push({ role: 'assistant', text: text || "(no response)", trace });
  } catch (e) {
    state.messages.push({ role: 'assistant', text: `Something went wrong talking to monday.com: ${e.message}`, trace: [] });
  } finally {
    state.sending = false;
    onProgress();
  }
}

// ============================================================================
// RENDERING (vanilla DOM, no framework)
// ============================================================================
const logEntries = [];
function pushLog(msg, kind) {
  logEntries.push({ msg, kind: kind || '' });
  renderSetup();
}

function boardStatusDot(exists) {
  return `<span class="dot ${exists ? 'ok' : ''}"></span>`;
}

function renderSetup() {
  const el = document.getElementById('view-setup');
  const woPct = Math.round((state.woImported / WO_DATA.length) * 100);
  const dealPct = Math.round((state.dealImported / DEAL_DATA.length) * 100);
  el.innerHTML = `
    <div class="banner"><b>What this does:</b> creates two monday.com boards from the supplied CSV data (one-time), then a Chat tab where every answer is computed live from monday.com via MCP — nothing is hardcoded at query time.</div>
    <div class="grid2">
      <div class="panel">
        <h2>Boards</h2>
        <div class="board-card">
          <div class="name">${boardStatusDot(!!state.woBoardId)}${WO_BOARD_NAME}</div>
          <div class="stat">id: ${state.woBoardId || '—'}</div>
          <div class="stat">${state.woImported}/${WO_DATA.length} items imported</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${woPct}%"></div></div>
        </div>
        <div class="board-card">
          <div class="name">${boardStatusDot(!!state.dealBoardId)}${DEAL_BOARD_NAME}</div>
          <div class="stat">id: ${state.dealBoardId || '—'}</div>
          <div class="stat">${state.dealImported}/${DEAL_DATA.length} items imported</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${dealPct}%"></div></div>
        </div>
        <button class="action" id="btn-run-setup" ${state.importing ? 'disabled' : ''}>${state.importing ? 'Working…' : (state.woImported >= WO_DATA.length && state.dealImported >= DEAL_DATA.length ? 'Re-run / resume setup' : 'Run setup & import')}</button>
        <button class="action secondary" id="btn-verify" ${state.importing ? 'disabled' : ''}>Verify live counts</button>
      </div>
      <div class="panel">
        <h2>Activity log</h2>
        <div style="font-size:12px;color:var(--muted);">Requires monday.com connected to this Claude account (MCP). Runs entirely via live API calls — nothing here is simulated.</div>
        <div id="log">${logEntries.length ? logEntries.map(l => `<div class="${l.kind}">${escapeHtml(l.msg)}</div>`).join('') : '<div class="empty" style="padding:10px 0;">No activity yet.</div>'}</div>
      </div>
    </div>
  `;
  document.getElementById('btn-run-setup').onclick = () => runSetupAndImport(pushLog, renderSetup);
  document.getElementById('btn-verify').onclick = () => verifyCounts(pushLog, renderSetup);
  const logDiv = document.getElementById('log');
  if (logDiv) logDiv.scrollTop = logDiv.scrollHeight;
}

const SUGGESTIONS = [
  "How's our pipeline looking for the mining sector?",
  "What's our total receivable amount right now?",
  "Which sector has the most stalled work orders?",
  "Prepare this week's leadership update",
  "Compare Won vs Dead deals by owner",
];

function renderChat() {
  const el = document.getElementById('view-chat');
  const ready = state.woBoardId && state.dealBoardId;
  el.innerHTML = `
    <div class="panel chat-wrap">
      ${!ready ? `<div class="banner">Boards not set up yet — go to <b>Setup</b> first, or just ask a question and I'll look the boards up by name.</div>` : ''}
      <div id="messages">
        ${state.messages.length === 0 ? `<div class="empty">Ask a founder-level question about work orders or the deal pipeline.<br><br>
          <div class="suggestions" id="suggestions">${SUGGESTIONS.map(s => `<button data-q="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}</div>
        </div>` : state.messages.map(renderMsg).join('')}
        ${state.sending ? `<div class="msg assistant"><div class="who">Agent</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>` : ''}
      </div>
      <div class="composer">
        <input id="chat-input" type="text" placeholder="Ask about revenue, pipeline, sectors, receivables…" ${state.sending ? 'disabled' : ''}/>
        <button id="chat-send" ${state.sending ? 'disabled' : ''}>Send</button>
      </div>
    </div>
  `;
  const input = document.getElementById('chat-input');
  const send = () => {
    const v = input.value.trim();
    if (!v || state.sending) return;
    input.value = '';
    sendChatMessage(v, null, () => { renderChat(); scrollMessages(); });
    renderChat();
  };
  document.getElementById('chat-send').onclick = send;
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  document.querySelectorAll('#suggestions button').forEach(b => {
    b.onclick = () => { input.value = b.dataset.q; send(); };
  });
  scrollMessages();
}

function scrollMessages() {
  const m = document.getElementById('messages');
  if (m) m.scrollTop = m.scrollHeight;
}

function renderMsg(m) {
  return `<div class="msg ${m.role}">
    <div class="who">${m.role === 'user' ? 'You' : 'Agent'}</div>
    <div class="bubble">${escapeHtml(m.text)}</div>
    ${m.trace && m.trace.length ? `<div class="tool-trace">via monday.com: ${m.trace.join(', ')}</div>` : ''}
  </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ----------------------------------------------------------------------------
// Nav wiring
// ----------------------------------------------------------------------------
document.getElementById('tab-setup').onclick = () => switchTab('setup');
document.getElementById('tab-chat').onclick = () => switchTab('chat');
function switchTab(tab) {
  state.tab = tab;
  document.getElementById('tab-setup').classList.toggle('active', tab === 'setup');
  document.getElementById('tab-chat').classList.toggle('active', tab === 'chat');
  document.getElementById('view-setup').style.display = tab === 'setup' ? 'block' : 'none';
  document.getElementById('view-chat').style.display = tab === 'chat' ? 'block' : 'none';
}

renderSetup();
renderChat();

</script>
